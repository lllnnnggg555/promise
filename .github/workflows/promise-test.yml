name: Promise A+ Test

on:
  push:
    branches:
      - master
      - optimize-promise-core
  pull_request:
    branches:
      - master

jobs:
  promise-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [10, 18]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run Promises/A+ compliance tests
        run: npm run promise-test
